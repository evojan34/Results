name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean App
        run: |
          # إنشاء مشروع جديد نظيف لتفادي أخطاء الإنشاء
          cd ..
          flutter create temp_app --platforms=android --org com.app.scoreboard
          
          # نسخ كود تطبيقك وملف الإعدادات إليه
          cp -f Results/pubspec.yaml temp_app/
          mkdir -p temp_app/lib
          if [ -f "Results/lib/main.dart" ]; then
            cp -f Results/lib/main.dart temp_app/lib/
          elif [ -f "Results/main.dart" ]; then
            cp -f Results/main.dart temp_app/lib/
          fi
          
          # الانتقال للمشروع وبناء التطبيق
          cd temp_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # نقل ملف الـ APK النهائي للخارج ليتم رفعه
          mkdir -p ../Results/build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../Results/build_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-release
          path: build_output/app-release.apk
